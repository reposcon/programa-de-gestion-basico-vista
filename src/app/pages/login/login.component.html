
<app-header></app-header>
<div class="login-container">
    <div class="container">
        <div class="card shadow-sm p-4"
        style="max-width: 400px; margin: auto; margin-top: 50px;">
        <div class="text-center mb-4">
            <i class="fas fa-user-circle fa-4x text-primary"></i>
            <h4 class="mt-2">Iniciar Sesión</h4>
        </div>

        <form (ngSubmit)="login()" #loginForm="ngForm">
            <div class="mb-3">
                <label for="name_user" class="form-label">Usuario</label>
                <input
                    type="text"
                    id="name_user"
                    class="form-control"
                    placeholder="Ingresa tu usuario"
                    [(ngModel)]="name_user"
                    name="name_user"
                    required />
            </div>
            <div class="mb-3">
                <label for="password_user" class="form-label">Contraseña</label>
                <input
                    type="password"
                    id="password_user"
                    class="form-control"
                    placeholder="Ingresa tu contraseña"
                    [(ngModel)]="password_user"
                    name="password_user"
                    required />
            </div>
            <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage
                }}</div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary"
                    [disabled]="loading">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </div>
        </form>

    </div>

    </div>
    <app-footer></app-footer>
