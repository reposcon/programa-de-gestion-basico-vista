<div class="p-4">
  <div *ngIf="summary" class="mb-4 animate__animated animate__fadeIn">
    </div>

  <app-table-generic
    [title]="title"
    [breadcrumb]="breadcrumb"
    [data]="history"
    [columns]="columns"
    [pageSize]="10"
    [actionTemplate]="null">

    <div class="d-flex align-items-center gap-3">

      <div class="d-flex align-items-center bg-white border px-3 py-2 rounded-3 shadow-sm">
        <div class="me-3 border-end pe-3">
          <small class="text-muted fw-bold d-block" style="font-size: 0.6rem;">FILTRAR</small>
          <span class="text-primary fw-bolder small">FECHA</span>
        </div>
        <input type="date"
          class="form-control form-control-sm border-0 shadow-none fw-bold p-0 text-dark"
          style="width: 130px; cursor: pointer;"
          (change)="filterByDate($any($event.target).value)">
      </div>

      <div class="vr opacity-25" style="height: 40px;"></div>

      <ng-container *ngIf="!isCashOpen">
        <div class="d-flex align-items-center gap-2 animate__animated animate__fadeIn">
          <div class="bg-white border p-1 rounded-pill d-flex align-items-center shadow-sm">
            <div class="input-group input-group-sm px-2" style="width: 160px;">
              <span class="input-group-text bg-transparent border-0 text-muted small">Base: $</span>
              <input type="number"
                class="form-control border-0 shadow-none fw-bold text-dark"
                [(ngModel)]="openingAmount" placeholder="0.00">
            </div>
            <button class="btn btn-success rounded-pill px-4 py-2 fw-bolder shadow-sm border-0 transform-hover"
              (click)="handleOpenSession()">
              <i class="bi bi-play-fill me-1"></i> ABRIR CAJA
            </button>
          </div>
        </div>
      </ng-container>

      <ng-container *ngIf="isCashOpen">
        <div class="d-flex align-items-center bg-white p-1 rounded-pill border shadow-sm animate__animated animate__fadeIn">
          <div class="d-flex align-items-center px-3">
            <div class="position-relative me-3">
              <i class="bi bi-circle-fill text-success" style="font-size: 0.8rem;"></i>
              <span class="position-absolute top-0 start-0 p-1 bg-success rounded-circle animate__animated animate__pulse animate__infinite opacity-50"></span>
            </div>
            <div class="d-flex flex-column">
              <span class="text-success fw-bolder" style="font-size: 0.75rem;">CAJA ACTIVA</span>
              <small class="text-muted fw-bold" style="font-size: 0.65rem;">Sesión #{{currentSession?.id}}</small>
            </div>
          </div>
          
          <div class="vr mx-2 opacity-25" style="height: 30px;"></div>
          
          <button class="btn btn-danger rounded-pill px-4 py-2 fw-bolder shadow-sm border-0 transform-hover"
            (click)="handleCloseSession()">
            <i class="bi bi-power me-1"></i> CERRAR TURNO
          </button>
        </div>
      </ng-container>

    </div>
  </app-table-generic>
</div>
