<div class="p-4 animate__animated animate__fadeIn">
  
  <app-table-generic
    [title]="title"
    [breadcrumb]="breadcrumb"
    [data]="sales"
    [columns]="columns"
    [pageSize]="10"
    (onSearch)="filterBySearch($event)"
    [actionTemplate]="invoiceAction">
    
    <div class="d-flex align-items-center gap-3">
      
      <div class="d-flex align-items-center bg-white border px-3 py-2 rounded-3 shadow-sm">
        <div class="me-3 border-end pe-3">
          <small class="text-muted fw-bold d-block" style="font-size: 0.6rem;">FILTRAR</small>
          <span class="text-primary fw-bolder small">FECHA</span>
        </div>
        <i class="bi bi-calendar3 text-primary me-2"></i>
        <input type="date" 
               class="form-control form-control-sm border-0 shadow-none fw-bold p-0 text-dark" 
               style="width: 130px; cursor: pointer;"
               (change)="filterByDate($any($event.target).value)">
      </div>


    </div>

  </app-table-generic>

  <ng-template #invoiceAction let-sale>
    <div class="d-flex justify-content-center">
      <button 
        (click)="downloadInvoice(sale.id_sale)"
        class="btn btn-outline-primary btn-sm rounded-circle shadow-sm d-flex align-items-center justify-content-center border-2 transform-hover"
        style="width: 38px; height: 38px;"
        title="Descargar Factura">
        <i class="bi bi-file-earmark-pdf-fill fs-5"></i>
      </button>
    </div>
  </ng-template>

</div>
