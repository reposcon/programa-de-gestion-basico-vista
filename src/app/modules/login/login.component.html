<app-header></app-header>

<div class="login-wrapper d-flex align-items-center justify-content-center bg-light">
  <div class="container">
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden mx-auto" style="max-width: 450px;">
      
      <div class="login-header-accent bg-primary w-100" style="height: 6px;"></div>

      <div class="card-body p-5">
        <div class="text-center mb-5">
          <div class="icon-circle bg-primary-subtle text-primary mx-auto mb-3 d-flex align-items-center justify-content-center">
            <i class="fas fa-user-shield fa-2x"></i>
          </div>
          <h3 class="fw-bold text-dark">¡Bienvenido!</h3>
          <p class="text-muted small">Por favor, ingresa tus credenciales</p>
        </div>

        <form (ngSubmit)="login()" #loginForm="ngForm" class="needs-validation">
          
          <div class="mb-4">
            <label for="name_user" class="form-label small fw-bold text-muted text-uppercase" style="letter-spacing: 1px;">Usuario</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0 ps-3">
                <i class="fas fa-user text-muted"></i>
              </span>
              <input
                type="text"
                id="name_user"
                class="form-control bg-light border-0 py-2 ps-2"
                placeholder="Nombre de usuario"
                [(ngModel)]="name_user"
                name="name_user"
                required />
            </div>
          </div>

          <div class="mb-4">
            <label for="password_user" class="form-label small fw-bold text-muted text-uppercase" style="letter-spacing: 1px;">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0 ps-3">
                <i class="fas fa-lock text-muted"></i>
              </span>
              <input
                type="password"
                id="password_user"
                class="form-control bg-light border-0 py-2 ps-2"
                placeholder="••••••••"
                [(ngModel)]="password_user"
                name="password_user"
                required />
            </div>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger border-0 small rounded-3 mb-4 animate__animated animate__shakeX">
            <i class="fas fa-exclamation-circle me-2"></i> {{ errorMessage }}
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm py-2"
                    [disabled]="loading || !loginForm.form.valid">
              <span *ngIf="!loading">
                <i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión
              </span>
              <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status"></span>
            </button>
          </div>

        </form>
      </div>
      
      <div class="card-footer bg-white border-0 text-center pb-4">
        <small class="text-muted">Acceso restringido para administradores</small>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
