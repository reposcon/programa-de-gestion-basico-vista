<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="container">
    <div class="card border-0 shadow-sm rounded-4 mx-auto overflow-hidden" style="max-width: 400px;">
      
      <div class="bg-primary" style="height: 5px;"></div>

      <div class="card-body p-4 p-md-5 bg-white">
        
        <div class="text-center mb-4">
          <div class="bg-primary text-white rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center shadow-sm" 
               style="width: 60px; height: 60px;">
            <i class="fas fa-lock fs-4"></i>
          </div>
          <h3 class="fw-bolder text-dark mb-1" style="letter-spacing: -1px;">Ingreso al Sistema</h3>
          <p class="text-muted small">Gestiona tu negocio de forma segura</p>
        </div>

        <form (ngSubmit)="login()" #loginForm="ngForm">
          
          <div class="mb-3">
            <label class="form-label small fw-bolder text-dark text-uppercase">Usuario</label>
            <div class="input-group border rounded-3 overflow-hidden">
              <span class="input-group-text bg-white border-0 pe-0">
                <i class="fas fa-user text-muted small"></i>
              </span>
              <input
                type="text"
                class="form-control border-0 py-2 shadow-none"
                placeholder="Ej: admin_principal"
                [(ngModel)]="name_user"
                name="name_user"
                required />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-bolder text-dark text-uppercase">Contraseña</label>
            <div class="input-group border rounded-3 overflow-hidden">
              <span class="input-group-text bg-white border-0 pe-0">
                <i class="fas fa-key text-muted small"></i>
              </span>
              <input
                type="password"
                class="form-control border-0 py-2 shadow-none"
                placeholder="••••••••"
                [(ngModel)]="password_user"
                name="password_user"
                required />
            </div>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger border-0 small rounded-3 mb-4 animate__animated animate__shakeX">
            <i class="fas fa-exclamation-triangle me-2"></i> {{ errorMessage }}
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm py-2 transform-hover"
                    [disabled]="loading || !loginForm.form.valid">
              <span *ngIf="!loading">
                <i class="fas fa-sign-in-alt me-2"></i> INICIAR SESIÓN
              </span>
              <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status"></span>
            </button>
          </div>

        </form>
      </div>
      
      <div class="card-footer bg-light border-0 text-center py-3">
        <span class="text-muted" style="font-size: 0.75rem;">
          <i class="fas fa-shield-alt me-1"></i> Panel de Administración Protegido
        </span>
      </div>
    </div>
  </div>
</div>
