<div class="d-flex min-vh-100 bg-light">

  <aside class="bg-white border-end d-flex flex-column col-auto col-md-3 col-xl-2 px-0 shadow-sm" id="sidebar">

    <div class="flex-grow-1 py-3 overflow-auto">
      <ul class="nav nav-pills flex-column px-3 gap-1">

        <li class="nav-item mt-2" *ngIf="authService.hasPermission('create_sales')">
          <small class="text-secondary fw-bold ms-2 mb-2 d-block" style="font-size: 0.7rem; letter-spacing: 0.5px;">VENTAS</small>
          <button class="nav-link w-100 text-start border-0 py-2 transition-all" 
                  [class.sidebar-active]="currentTab === 'pos'" 
                  [class.text-dark]="currentTab !== 'pos'"
                  (click)="currentTab = 'pos'">
            <i class="fas fa-cash-register me-3"></i>Punto de Venta
          </button>
        </li>

        <li class="nav-item" *ngIf="authService.hasPermission('view_sales')">
          <small class="text-secondary fw-bold ms-2 my-2 d-block" style="font-size: 0.7rem; letter-spacing: 0.5px;">CAJA Y CONTROL</small>
          <button class="nav-link w-100 text-start border-0 py-2 mb-1 transition-all" 
                  [class.sidebar-active]="currentTab === 'daily-sales'" 
                  [class.text-dark]="currentTab !== 'daily-sales'"
                  (click)="currentTab = 'daily-sales'">
            <i class="fas fa-file-invoice-dollar me-3"></i>Ventas Diarias
          </button>
          <button class="nav-link w-100 text-start border-0 py-2 transition-all" 
                  [class.sidebar-active]="currentTab === 'cash-management'" 
                  [class.text-dark]="currentTab !== 'cash-management'"
                  (click)="currentTab = 'cash-management'">
            <i class="fas fa-vault me-3"></i>Gestión de Caja
          </button>
        </li>

        <li class="nav-item" *ngIf="authService.hasPermission('view_customers')">
          <small class="text-secondary fw-bold ms-2 my-2 d-block" style="font-size: 0.7rem; letter-spacing: 0.5px;">CLIENTES</small>
          <button class="nav-link w-100 text-start border-0 py-2 transition-all" 
                  [class.sidebar-active]="currentTab === 'customers'" 
                  [class.text-dark]="currentTab !== 'customers'"
                  (click)="currentTab = 'customers'">
            <i class="fas fa-user-friends me-3"></i>Ver Clientes
          </button>
        </li>

        <li class="nav-item" *ngIf="authService.hasPermission('view_products') || authService.hasPermission('view_subcategories')">
          <small class="text-secondary fw-bold ms-2 my-2 d-block" style="font-size: 0.7rem; letter-spacing: 0.5px;">INVENTARIO</small>
          <button *ngIf="authService.hasPermission('view_products')" 
                  class="nav-link w-100 text-start border-0 py-2 mb-1 transition-all" 
                  [class.sidebar-active]="currentTab === 'products'" (click)="currentTab = 'products'"
                  [class.text-dark]="currentTab !== 'products'">
            <i class="fas fa-box me-3"></i>Productos
          </button>
          <button *ngIf="authService.hasPermission('view_subcategories')" 
                  class="nav-link w-100 text-start border-0 py-2 mb-1 transition-all" 
                  [class.sidebar-active]="currentTab === 'subcategories'" (click)="currentTab = 'subcategories'"
                  [class.text-dark]="currentTab !== 'subcategories'">
            <i class="fas fa-layer-group me-3"></i>Subcategorías
          </button>
          <button *ngIf="authService.hasPermission('view_categories')" 
                  class="nav-link w-100 text-start border-0 py-2 transition-all" 
                  [class.sidebar-active]="currentTab === 'categories'" (click)="currentTab = 'categories'"
                  [class.text-dark]="currentTab !== 'categories'">
            <i class="fas fa-tags me-3"></i>Categorías
          </button>
        </li>

        <li *ngIf="authService.hasPermission('view_users')" class="nav-item">
          <small class="text-secondary fw-bold ms-2 my-2 d-block" style="font-size: 0.7rem; letter-spacing: 0.5px;">CONFIGURACIÓN</small>
          <button class="nav-link w-100 text-start border-0 py-2 transition-all" 
                  [class.sidebar-active]="currentTab === 'users'"
                  [class.text-dark]="currentTab !== 'users'"
                  (click)="currentTab = 'users'"> 
            <i class="fas fa-users-cog me-3"></i>Usuarios
          </button>
        </li>
      </ul>
    </div>

    <div class="p-3 bg-light border-top">
      <button class="btn btn-danger w-100 fw-bold border-0 shadow-sm rounded-3 py-2" (click)="logout($event)">
        <i class="fas fa-sign-out-alt me-2"></i>Salir del Sistema
      </button>
    </div>
  </aside>

  <main class="flex-grow-1 d-flex flex-column overflow-hidden bg-light">
    <div class="p-4 overflow-auto flex-grow-1">
      <div [ngSwitch]="currentTab">
        <div *ngSwitchCase="'pos'">
           <app-pos></app-pos> 
        </div>

        <div *ngSwitchDefault class="card border-0 shadow-sm rounded-4 p-2">
          <div [ngSwitch]="currentTab">
            <app-daily-sales *ngSwitchCase="'daily-sales'"></app-daily-sales>
            <app-cash-control *ngSwitchCase="'cash-management'"></app-cash-control>
            <app-customer *ngSwitchCase="'customers'"></app-customer>
            <app-product-page *ngSwitchCase="'products'"></app-product-page>
            <app-subcategory-page *ngSwitchCase="'subcategories'"></app-subcategory-page>
            <app-category-page *ngSwitchCase="'categories'"></app-category-page>
            <app-crud-users *ngSwitchCase="'users'"></app-crud-users>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
