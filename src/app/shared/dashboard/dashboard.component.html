<div class="d-flex min-vh-100 bg-light">

  <aside class="bg-white shadow-sm border-end d-flex flex-column col-auto col-md-3 col-xl-2 px-0" id="sidebar">

    <div class="flex-grow-1 py-4 overflow-auto">
      <ul class="nav nav-pills flex-column px-3 gap-2">

        <li class="nav-item" *ngIf="authService.hasPermission('create_sales')">
          <small class="text-muted text-uppercase fw-bold ms-2 mb-2 d-block" style="font-size: 0.65rem;">Ventas</small>
          <button class="nav-link w-100 text-start rounded-pill py-2" 
                  [class.active]="currentTab === 'pos'" 
                  (click)="currentTab = 'pos'">
            <i class="fas fa-cash-register me-3"></i>Punto de Venta
          </button>
        </li>

        <li class="nav-item" *ngIf="authService.hasPermission('view_products') || 
                                   authService.hasPermission('view_subcategories') || 
                                   authService.hasPermission('view_categories')">
          <small class="text-muted text-uppercase fw-bold ms-2 my-2 d-block" style="font-size: 0.65rem;">Inventario</small>

          <button *ngIf="authService.hasPermission('view_products')" 
                  class="nav-link w-100 text-start rounded-pill py-2 mb-1" 
                  [class.active]="currentTab === 'products'" (click)="currentTab = 'products'">
            <i class="fas fa-box me-3"></i>Productos
          </button>

          <button *ngIf="authService.hasPermission('view_subcategories')" 
                  class="nav-link w-100 text-start rounded-pill py-2 mb-1" 
                  [class.active]="currentTab === 'subcategories'" (click)="currentTab = 'subcategories'">
            <i class="fas fa-layer-group me-3"></i>Subcategorías
          </button>

          <button *ngIf="authService.hasPermission('view_categories')" 
                  class="nav-link w-100 text-start rounded-pill py-2" 
                  [class.active]="currentTab === 'categories'" (click)="currentTab = 'categories'">
            <i class="fas fa-tags me-3"></i>Categorías
          </button>
        </li>

        <li *ngIf="authService.hasPermission('view_users')" class="nav-item mt-auto">
          <small class="text-muted text-uppercase fw-bold ms-2 my-2 d-block" style="font-size: 0.65rem;">Admin</small>
          <button class="nav-link w-100 text-start rounded-pill py-2" 
                  [class.active]="currentTab === 'users'"
                  (click)="currentTab = 'users'"> <i class="fas fa-users-cog me-3"></i>Usuarios
          </button>
        </li>
      </ul>
    </div>

    <div class="p-3 border-top">
      <button class="btn btn-outline-danger w-100 rounded-pill py-2" (click)="logout($event)">
        <i class="fas fa-sign-out-alt me-2"></i>Salir
      </button>
    </div>
  </aside>

  <main class="flex-grow-1 d-flex flex-column overflow-hidden">

    <header class="bg-white border-bottom p-3 d-flex justify-content-between align-items-center px-4 shadow-sm">
      <div class="d-flex align-items-center gap-2">
        <h4 class="m-0 fw-bold text-dark">{{ getTitle() }}</h4>
      </div>
      <div class="d-flex align-items-center gap-3">
        <div class="text-end d-none d-md-block border-end pe-3">
          <small class="text-muted d-block" style="font-size: 0.7rem;">Hoy</small>
          <span class="fw-bold text-primary">{{ today | date:'dd MMM, yyyy' }}</span>
        </div>
      </div>
    </header>

    <div class="p-4 overflow-auto flex-grow-1">
      <div [ngSwitch]="currentTab">

        <div *ngSwitchCase="'pos'">
           <app-pos></app-pos> </div>

        <div *ngSwitchCase="'products'" class="card border-0 shadow-sm p-4 rounded-4">
          <app-product-page></app-product-page>
        </div>

        <div *ngSwitchCase="'subcategories'" class="card border-0 shadow-sm p-4 rounded-4">
          <app-subcategory-page></app-subcategory-page>
        </div>

        <div *ngSwitchCase="'categories'" class="card border-0 shadow-sm p-4 rounded-4">
          <app-category-page></app-category-page>
        </div>

        <div *ngSwitchCase="'users'" class="card border-0 shadow-sm p-4 rounded-4">
          <app-crud-users></app-crud-users>
        </div>

      </div>
    </div>
  </main>
</div>
