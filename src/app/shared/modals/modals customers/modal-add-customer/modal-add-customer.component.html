<div class="modal fade" id="modalAddCust" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <div class="modal-header bg-success text-white py-3 px-4">
        <h5 class="modal-title fw-bold"><i class="bi bi-person-plus-fill me-2"></i>Nuevo Cliente</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" id="closeAddCust"></button>
      </div>
      <div class="modal-body p-4">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-bold small">Nombre Completo</label>
            <input type="text" class="form-control rounded-pill border-0 bg-light px-3" [(ngModel)]="customer.name_customer">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold small">Documento / NIT</label>
            <input type="text" class="form-control rounded-pill border-0 bg-light px-3" [(ngModel)]="customer.document_number_customer">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold small">Teléfono</label>
            <input type="text" class="form-control rounded-pill border-0 bg-light px-3" [(ngModel)]="customer.phone_customer">
          </div>
          <div class="col-12">
            <label class="form-label fw-bold small">Correo Electrónico</label>
            <input type="email" class="form-control rounded-pill border-0 bg-light px-3" [(ngModel)]="customer.email_customer">
          </div>
        </div>
      </div>
      <div class="modal-footer border-0 p-4 pt-0">
        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm" 
                (click)="save()" [disabled]="!customer.name_customer || !customer.document_number_customer">
          Guardar Cliente
        </button>
      </div>
    </div>
  </div>
</div>
