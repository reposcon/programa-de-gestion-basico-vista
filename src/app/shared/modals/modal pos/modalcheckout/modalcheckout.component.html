<div class="modal fade" id="modalPago" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered shadow-lg" style="max-width: 450px;">
    <div class="modal-content border-0 rounded-4">
      
      <div class="modal-header border-0 bg-light py-3">
        <h5 class="modal-title fw-bold text-dark d-flex align-items-center">
          <i class="fas fa-cash-register me-2 text-primary"></i> Finalizar Venta
        </h5>
        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" (click)="resetInternal()"></button>
      </div>

      <div class="modal-body px-4 py-3">
        <div class="text-center mb-4 p-3 bg-success-subtle rounded-3 border border-success">
          <span class="text-success small fw-bold text-uppercase">Total a Recibir</span>
          <h2 class="fw-bold text-success m-0">{{ total | currency }}</h2>
        </div>

        <div class="row g-3">
          <div class="col-12">
            <label class="form-label small fw-bold text-muted mb-1">MÉTODO DE PAGO</label>
            <div class="input-group mb-3">
              <span class="input-group-text bg-white border-end-0 text-muted"><i class="fas fa-wallet"></i></span>
              <select class="form-select border-start-0 fw-bold shadow-none" [(ngModel)]="selectedPaymentMethodId">
                <option *ngFor="let m of paymentMethods" [value]="m.id_payment_method">
                  {{ m.name_payment_method }}
                </option>
              </select>
            </div>
          </div>

          <div class="col-12">
            <label class="form-label small fw-bold text-muted mb-1">¿CUÁNTO RECIBES?</label>
            <div class="input-group mb-2">
              <span class="input-group-text bg-white border-end-0 text-success fw-bold">$</span>
              <input type="number" 
                     class="form-control form-control-lg border-start-0 fw-bold text-primary shadow-none" 
                     [(ngModel)]="amount_paid" 
                     (input)="calculateChange()"
                     placeholder="0.00">
            </div>
          </div>
        </div>

        <div class="mt-3 p-3 rounded-3 border transition-all" 
             [ngClass]="amount_paid >= total ? 'bg-primary-subtle border-primary' : 'bg-light border-dashed'">
          <div class="d-flex justify-content-between align-items-center">
            <span class="fw-bold text-muted small">CAMBIO (DEVUELTA):</span>
            <span class="h4 mb-0 fw-bold" [class.text-primary]="amount_paid >= total">
              {{ (change_returned > 0 ? change_returned : 0) | currency }}
            </span>
          </div>
        </div>

        <div *ngIf="amount_paid < total && amount_paid > 0" class="text-danger small mt-2 text-center fw-bold">
          <i class="fas fa-exclamation-triangle me-1"></i> Faltan {{ (total - amount_paid) | currency }}
        </div>
      </div>

      <div class="modal-footer border-0 p-4 pt-0">
        <button class="btn btn-success btn-lg w-100 py-3 rounded-3 fw-bold shadow-sm" 
                (click)="confirmSale()" 
                data-bs-dismiss="modal" 
                [disabled]="amount_paid < total">
          <i class="fas fa-check-circle me-2"></i> CONFIRMAR PAGO
        </button>
      </div>
    </div>
  </div>
</div>
