<div class="modal fade" id="modalEditarCategoria" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
      
      <div class="modal-header border-0 py-3 px-4 d-flex align-items-center" 
           style="background: linear-gradient(135deg, #ffc107, #e0a800);">
        <h5 class="modal-title text-dark fw-bold d-flex align-items-center">
          <div class="bg-white rounded-circle p-2 me-3 d-flex align-items-center justify-content-center shadow-sm" style="width: 35px; height: 35px;">
             <i class="fas fa-edit text-warning" style="font-size: 0.9rem;"></i>
          </div>
          Editar Categoría
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form (ngSubmit)="update()">
        <div class="modal-body p-4">
          <div class="mb-4">
            <label class="form-label small fw-bold text-muted text-uppercase mb-2" style="letter-spacing: 0.5px;">
              Nombre de la Categoría
            </label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0 ps-3 text-muted">
                <i class="fas fa-tag"></i>
              </span>
              <input type="text" 
                     class="form-control bg-light border-0 py-2 ps-2"
                     [(ngModel)]="categoryEdit.name_category" 
                     name="name_category"
                     placeholder="Nombre de la categoría"
                     required>
            </div>
            <div class="form-text mt-2 small text-muted">
              Modifica el nombre y presiona actualizar para guardar los cambios.
            </div>
          </div>

        </div>

        <div class="modal-footer border-top-0 px-4 pb-4 pt-0 gap-2">
          <button type="button" 
                  class="btn btn-light rounded-pill px-4 fw-bold text-muted border shadow-sm" 
                  data-bs-dismiss="modal">
            Cancelar
          </button>
          <button type="submit" 
                  class="btn btn-warning rounded-pill px-4 fw-bold shadow-sm text-dark"
                  data-bs-dismiss="modal"
                  [disabled]="!categoryEdit.name_category">
            <i class="fas fa-save me-2"></i>Actualizar Cambios
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
