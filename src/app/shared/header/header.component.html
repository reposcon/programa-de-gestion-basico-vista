<header class="bg-white border-bottom sticky-top py-2">
  <div class="container-fluid d-flex align-items-center justify-content-between px-4">

    <div class="d-flex align-items-center cursor-pointer" (click)="openHome()" style="cursor: pointer;">
      <div class="bg-primary rounded-3 d-flex align-items-center justify-content-center me-2 shadow-sm" 
           style="width: 35px; height: 35px;">
        <i class="fas fa-layer-group text-white fs-5"></i>
      </div>
      <h4 class="m-0 fw-bolder text-dark" style="letter-spacing: -1px;">
        Admin<span class="text-primary">Panel</span>
      </h4>
    </div>

    <div class="d-flex align-items-center gap-4" *ngIf="userlogged">
      
      <div class="text-end d-none d-sm-block">
        <div class="small text-muted mb-0" style="font-size: 0.75rem;">Sesión iniciada como:</div>
        <div class="fw-bold text-dark">{{ userlogged.name_user }}</div>
      </div>

      <div class="badge rounded-pill px-3 py-2 d-flex align-items-center border-0 shadow-none"
           [ngClass]="userlogged.state_user === 1 ? 'bg-success-soft text-success' : 'bg-secondary-soft text-secondary'">
        <i class="bi bi-circle-fill me-2" style="font-size: 0.5rem;" 
           [class.text-success]="userlogged.state_user === 1"
           [class.text-secondary]="userlogged.state_user !== 1">
        </i>
        <span class="fw-bolder text-uppercase" style="font-size: 0.7rem; letter-spacing: 0.5px;">
          {{ userlogged.state_user === 1 ? 'En Línea' : 'Desconectado' }}
        </span>
      </div>
    </div>

  </div>
</header>
